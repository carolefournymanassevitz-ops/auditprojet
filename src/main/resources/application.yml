spring:
  application:
    name: poc-tracabilite
  datasource:
    url: ${POC_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: portal_app
    password: ${PORTAL_APP_PASSWORD}
  flyway:
    # Flyway migre avec le compte propriétaire ; l'application tourne avec PORTAL_APP.
    user: portal
    password: ${PORTAL_PASSWORD}
    default-schema: PORTAL
    schemas: PORTAL
  jackson:
    deserialization:
      # Un champ inattendu (par exemple un auteur) est refusé au lieu d'être ignoré
      # (ST-04 : auteur lu dans le jeton, jamais fourni par le client).
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${POC_ISSUER_URI:http://localhost:8180/realms/poc}

server:
  port: 8090

poc:
  api-name: poc-sup
  # Désignation → propriétaires visibles (RG-10 : un utilisateur ne voit et n'agit que sur les équipements dont
  # son ELD est propriétaire ou gestionnaire). ELD_B gère aussi ELD_C par délégation.
  perimetre:
    "[ELD_A]": [ELD_A]
    "[ELD_B]": [ELD_B, ELD_C]
